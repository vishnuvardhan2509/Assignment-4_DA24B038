global:
  resolve_timeout: 1m
route:
  receiver: local-evaluation
  group_by: ['alertname']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
receivers:
  # Local receiver deliberately has no email/webhook. Alerts are visible in the
  # Alertmanager API/UI; external delivery requires a user-owned destination.
  - name: local-evaluation
